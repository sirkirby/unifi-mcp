name: "Check: Cross-package pin alignment"

# Verifies that each downstream wheel's declared pin permits an importable
# upstream when resolved against PyPI. Catches the failure mode where
# workspace [tool.uv.sources] masks a stale pin in [project.dependencies]
# (incident #283). Uses no untrusted event inputs — only repo source.
#
# The path filters cover every file that ends up in a built wheel (each
# package's pyproject.toml and src/ tree, plus the API's force-included alembic
# files), upstream and downstream alike, and the gate's own inputs. A package
# whose wheel contents change can change what the gate observes.

on:
  push:
    branches: [ main, develop ]
    paths:
      - "apps/*/pyproject.toml"
      - "apps/*/src/**"
      - "apps/*/alembic/**"
      - "apps/*/alembic.ini"
      - "packages/*/pyproject.toml"
      - "packages/*/src/**"
      - "scripts/generate_api_action_catalog.py"
      - "scripts/check_pin_alignment.py"
      - ".github/workflows/check-pin-alignment.yml"
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main, develop ]
    paths:
      - "apps/*/pyproject.toml"
      - "apps/*/src/**"
      - "apps/*/alembic/**"
      - "apps/*/alembic.ini"
      - "packages/*/pyproject.toml"
      - "packages/*/src/**"
      - "scripts/generate_api_action_catalog.py"
      - "scripts/check_pin_alignment.py"
      - ".github/workflows/check-pin-alignment.yml"

permissions:
  contents: read

jobs:
  pin-alignment:
    name: "Pin alignment (PyPI install + smoke import)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs needs full history to derive versions from tags

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run pin-alignment check
        # `uv run` resolves the script's PEP 723 dependency on packaging, which
        # provides standards-compliant PEP 508 requirement and PEP 440 version parsing.
        run: uv run scripts/check_pin_alignment.py

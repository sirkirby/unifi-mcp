name: "Sync versions on release"

on:
  push:
    tags:
      - 'network/v*.*.*'
      - 'protect/v*.*.*'
      - 'access/v*.*.*'
      - 'core/v*.*.*'
      - 'shared/v*.*.*'
      - 'relay/v*.*.*'
      - 'v*.*.*'  # Legacy tag format (network)

# Debounce: if multiple tags are pushed within seconds, only the last
# workflow run proceeds. Earlier runs detect the branch has moved and skip.
concurrency:
  group: bump-versions
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bump:
    name: Sync all version references
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: main
        fetch-depth: 0
        fetch-tags: true
        token: ${{ secrets.PUSH_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Update independent plugin versions and server pins
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: python3 scripts/plugin_versions.py sync --releasing "$RELEASE_TAG"

    - name: Commit and push if changed
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add -A

        if git diff --cached --quiet; then
          echo "No version changes to commit"
          exit 0
        fi

        git commit -m "chore(plugins): sync plugin versions to current release tags"
        git push

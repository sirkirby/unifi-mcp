name: "Generated Artifacts: Check Drift"

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

jobs:
  check-drift:
    name: Check generated files and generation contracts
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install generation dependencies
      run: uv sync --all-packages

    - name: Check generated files and harness contracts
      run: make catalog-test check-generated

    - name: Check independent plugin versions
      if: github.event_name == 'pull_request'
      env:
        PLUGIN_BASE: ${{ github.event.pull_request.base.sha }}
      run: make check-plugin-versions PLUGIN_VERSION_BASE="$PLUGIN_BASE"

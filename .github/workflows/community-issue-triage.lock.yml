        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: activation
          include-hidden-files: true
          path: |
            /tmp/gh-aw/aw_info.json
            /tmp/gh-aw/models.json
            /tmp/gh-aw/aw-prompts/prompt.txt
            /tmp/gh-aw/aw-prompts/prompt-template.txt
            /tmp/gh-aw/aw-prompts/prompt-import-tree.json
            /tmp/gh-aw/github_rate_limits.jsonl
            /tmp/gh-aw/base
            /tmp/gh-aw/.github/agents
            /tmp/gh-aw/.github/skills
          if-no-files-found: ignore
          retention-days: 1

  agent:
    needs:
      - activation
      - intake_gate
      - qualifying_rate_gate
      - trusted_issue_snapshot
    if: >
      (needs.activation.outputs.daily_ai_credits_exceeded != 'true') && (needs.intake_gate.outputs.eligible == 'true' &&
      needs.qualifying_rate_gate.outputs.allowed == 'true')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: "community-issue-triage-agent"
      queue: max
    timeout-minutes: 60
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_AW_ASSETS_ALLOWED_EXTS: ""
      GH_AW_ASSETS_BRANCH: ""
      GH_AW_ASSETS_MAX_SIZE_KB: 0
      GH_AW_MCP_LOG_DIR: /tmp/gh-aw/mcp-logs/safeoutputs
      GH_AW_PR_HEAD_BASE_BRANCH: ""
      GH_AW_PR_HEAD_BASE_PR_NUMBER: ""
      GH_AW_PR_HEAD_BASE_REF: ""
      GH_AW_PR_HEAD_BASE_REPO: ""
      GH_AW_PR_HEAD_BASE_SHA: ""
      GH_AW_PR_HEAD_REPO: ""
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_WORKFLOW_ID_SANITIZED: communityissuetriage
    outputs:
      agentic_engine_timeout: ${{ steps.detect-agent-errors.outputs.agentic_engine_timeout || 'false' }}
      ai_credits_rate_limit_error: ${{ steps.parse-mcp-gateway.outputs.ai_credits_rate_limit_error || 'false' }}
      aic: ${{ steps.parse-mcp-gateway.outputs.aic }}
      ambient_context: ${{ steps.parse-mcp-gateway.outputs.ambient_context }}
      effective_tokens: ${{ steps.parse-mcp-gateway.outputs.effective_tokens }}
      has_patch: ${{ steps.collect_output.outputs.has_patch }}
      http_400_response_error: ${{ steps.detect-agent-errors.outputs.http_400_response_error || 'false' }}
      inference_access_error: ${{ steps.detect-agent-errors.outputs.inference_access_error || 'false' }}
      invocation_cap_exceeded: ${{ steps.detect-agent-errors.outputs.invocation_cap_exceeded || 'false' }}
      max_cache_misses_exceeded: ${{ steps.detect-agent-errors.outputs.max_cache_misses_exceeded || 'false' }}
      mcp_policy_error: ${{ steps.detect-agent-errors.outputs.mcp_policy_error || 'false' }}
      missing_model_pricing_error: ${{ steps.detect-agent-errors.outputs.missing_model_pricing_error || 'false' }}
      missing_model_pricing_model_name: ${{ steps.detect-agent-errors.outputs.missing_model_pricing_model_name || '' }}
      model: ${{ needs.activation.outputs.model }}
      model_not_supported_error: ${{ steps.detect-agent-errors.outputs.model_not_supported_error || 'false' }}
      output: ${{ steps.collect_output.outputs.output }}
      output_types: ${{ steps.collect_output.outputs.output_types }}
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
      shell_expansion_guard_rejected: ${{ steps.detect-agent-errors.outputs.shell_expansion_guard_rejected || 'false' }}
      unknown_model_ai_credits: ${{ steps.parse-mcp-gateway.outputs.unknown_model_ai_credits || 'false' }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@49dc896ccb7d6d975514cfe232bcbd68cc12e2c1 # v0.87.9
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Community issue triage"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/community-issue-triage.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.80"
          GH_AW_INFO_AWF_VERSION: "v0.28.9"
          GH_AW_INFO_ENGINE_ID: "copilot"
      - name: Set runtime paths
        id: set-runtime-paths
        run: |
          if [ -z "${RUNNER_TOOL_CACHE:-}" ]; then
            echo "RUNNER_TOOL_CACHE=${{ runner.tool_cache }}" >> "$GITHUB_ENV"
          fi
          {
            echo "GH_AW_SAFE_OUTPUTS=${RUNNER_TEMP}/gh-aw/safeoutputs/outputs.jsonl"
            echo "GH_AW_SAFE_OUTPUTS_CONFIG_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/config.json"
            echo "GH_AW_SAFE_OUTPUTS_TOOLS_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/tools.json"
          } >> "$GITHUB_OUTPUT"
      - name: Mask OTLP telemetry headers
        run: bash "${RUNNER_TEMP}/gh-aw/actions/mask_otlp_headers.sh"
      - name: Check OTLP telemetry configuration
        run: bash "${RUNNER_TEMP}/gh-aw/actions/check_otlp_default_credentials.sh"
      - name: Create gh-aw temp directory
        run: bash "${RUNNER_TEMP}/gh-aw/actions/create_gh_aw_tmp_dir.sh"
      - name: Configure gh CLI for GitHub Enterprise
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_gh_for_ghe.sh"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download activation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: activation
          path: /tmp/gh-aw
      - name: Install GitHub Copilot CLI
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_copilot_cli.sh"
        env:
          GH_HOST: github.com
          GH_AW_COMPILED_VERSION: v0.87.9
      - name: Install AWF binary
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_awf_binary.sh" v0.28.9 --rootless
      - name: Restore inline sub-agents from activation artifact
        env:
          GH_AW_SUB_AGENT_DIR: ".github/agents"
          GH_AW_SUB_AGENT_EXT: ".agent.md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_sub_agents.sh"
      - name: Restore inline skills from activation artifact
        env:
          GH_AW_SKILL_DIR: ".github/skills"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_skills.sh"
      - env:
          GH_AW_SAFE_OUTPUTS: ${{ steps.set-runtime-paths.outputs.GH_AW_SAFE_OUTPUTS }}
          LEGACY_RESERVATION_NAME: community-issue-triage-aic-reservation
          LEGACY_RESERVED_AI_CREDITS: "75"
          MAX_AI_CREDITS: "25"
          MAX_DAILY_AI_CREDITS: "150"
          RESERVATION_NAME: community-issue-triage-aic-reservation-v2
          RESERVED_AI_CREDITS: "25"
        id: reserve_daily_budget
        name: Reserve the conservative daily AI credit budget
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: "const fs = require(\"fs\");\nconst path = require(\"path\");\n\nconst block = (message) => {\n  core.setOutput(\"allowed\", \"false\");\n  if (typeof process.env.GH_AW_SAFE_OUTPUTS !== \"string\" || process.env.GH_AW_SAFE_OUTPUTS === \"\") {\n    throw new Error(\"safe-output path is unavailable for a fail-closed budget decision\");\n  }\n  fs.appendFileSync(\n    process.env.GH_AW_SAFE_OUTPUTS,\n    JSON.stringify({type: \"noop\", message}) + \"\\n\",\n    {encoding: \"utf8\", mode: 0o600},\n  );\n  core.setFailed(message);\n};\n\ncore.setOutput(\"allowed\", \"false\");\nconst reservationName = process.env.RESERVATION_NAME;\nconst legacyReservationName = process.env.LEGACY_RESERVATION_NAME;\nconst reservedPerRun = Number(process.env.RESERVED_AI_CREDITS);\nconst legacyReservedPerRun = Number(process.env.LEGACY_RESERVED_AI_CREDITS);\nconst maxPerRun = Number(process.env.MAX_AI_CREDITS);\nconst daily = Number(process.env.MAX_DAILY_AI_CREDITS);\nif (\n  typeof reservationName !== \"string\" || reservationName === \"\" ||\n  typeof legacyReservationName !== \"string\" || legacyReservationName === \"\" ||\n  reservationName === legacyReservationName ||\n  !Number.isFinite(reservedPerRun) || reservedPerRun <= 0 ||\n  !Number.isFinite(legacyReservedPerRun) || legacyReservedPerRun <= 0 ||\n  !Number.isFinite(maxPerRun) || maxPerRun !== reservedPerRun ||\n  !Number.isFinite(daily) || daily < maxPerRun\n) {\n  block(\"The daily AI credit reservation configuration is invalid; no public action was taken.\");\n  return;\n}\n\ntry {\n  const currentRun = await github.rest.actions.getWorkflowRun({\n    owner: context.repo.owner,\n    repo: context.repo.repo,\n    run_id: Number(context.runId),\n  });\n  const workflowId = Number(currentRun.data?.workflow_id);\n  if (!Number.isSafeInteger(workflowId) || workflowId < 1) {\n    throw new Error(\"current workflow ID is invalid\");\n  }\n  const cutoff = Date.now() - 24 * 60 * 60 * 1000;\n  const reservedRunIds = new Set();\n  let reserved = 0;\n  const reservationKinds = [\n    {name: reservationName, credits: reservedPerRun},\n    {name: legacyReservationName, credits: legacyReservedPerRun},\n  ];\n  for (const reservationKind of reservationKinds) {\n    const response = await github.rest.actions.listArtifactsForRepo({\n      owner: context.repo.owner,\n      repo: context.repo.repo,\n      name: reservationKind.name,\n      per_page: 100,\n      page: 1,\n    });\n    const totalCount = Number(response.data?.total_count);\n    const artifacts = response.data?.artifacts;\n    if (\n      !Array.isArray(artifacts) ||\n      !Number.isSafeInteger(totalCount) ||\n      totalCount < 0 ||\n      totalCount > 100 ||\n      artifacts.length !== totalCount\n    ) {\n      throw new Error(\"daily reservation artifact history exceeds the trusted bound\");\n    }\n    for (const artifact of artifacts) {\n      if (artifact?.name !== reservationKind.name) {\n        throw new Error(\"GitHub returned an unexpected reservation artifact name\");\n      }\n      const createdAt = Date.parse(artifact.created_at || \"\");\n      if (!Number.isFinite(createdAt)) {\n        throw new Error(\"GitHub returned an invalid reservation timestamp\");\n      }\n      if (createdAt < cutoff) continue;\n      if (artifact.expired) {\n        throw new Error(\"a current-window reservation artifact is unexpectedly expired\");\n      }\n      const runId = Number(artifact.workflow_run?.id);\n      if (!Number.isSafeInteger(runId) || runId < 1 || reservedRunIds.has(runId)) {\n        throw new Error(\"reservation workflow provenance is invalid or duplicated\");\n      }\n      const run = await github.rest.actions.getWorkflowRun({\n        owner: context.repo.owner,\n        repo: context.repo.repo,\n        run_id: runId,\n      });\n      const reservationWorkflowId = Number(run.data?.workflow_id);\n      if (!Number.isSafeInteger(reservationWorkflowId) || reservationWorkflowId < 1) {\n        throw new Error(\"reservation workflow ID is invalid\");\n      }\n      if (reservationWorkflowId !== workflowId) continue;\n      reservedRunIds.add(runId);\n      reserved += reservationKind.credits;\n    }\n  }\n\n  if (reserved + reservedPerRun > daily) {\n    block(\"The conservative daily AI credit budget is exhausted; no public action was taken.\");\n    core.notice(`Daily AI credit reservation blocked at ${reserved}/${daily}.`);\n    return;\n  }\n\n  const directory = path.join(process.env.RUNNER_TEMP, \"triage-aic-reservation\");\n  fs.mkdirSync(directory, {recursive: true, mode: 0o700});\n  fs.writeFileSync(\n    path.join(directory, \"reservation.json\"),\n    JSON.stringify({\n      actor: process.env.GITHUB_ACTOR,\n      credits: reservedPerRun,\n      max_ai_credits: maxPerRun,\n      run_id: String(context.runId),\n      version: 2,\n      workflow_id: String(workflowId),\n    }),\n    {encoding: \"utf8\", mode: 0o600},\n  );\n  core.setOutput(\"allowed\", \"true\");\n} catch (error) {\n  const message = error instanceof Error ? error.message : \"unknown error\";\n  core.warning(`Daily AI credit reservation failed closed: ${message}`);\n  block(\"The daily AI credit reservation could not be verified; no public action was taken.\");\n}\n"
      - if: ${{ steps.reserve_daily_budget.outputs.allowed == 'true' }}
        name: Commit the daily AI credit reservation before inference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
          name: community-issue-triage-aic-reservation-v2
          overwrite: false
          path: ${{ runner.temp }}/triage-aic-reservation/reservation.json
          retention-days: 2
      - if: ${{ steps.reserve_daily_budget.outputs.allowed == 'true' }}
        name: Download the trusted issue snapshot for inference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.trusted_issue_snapshot.outputs.artifact_id }}
          path: ${{ runner.temp }}/trusted-intake-download
      - env:
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.trusted_issue_snapshot.outputs.artifact_digest }}
          EXPECTED_ARTIFACT_ID: ${{ needs.trusted_issue_snapshot.outputs.artifact_id }}
          EXPECTED_BUNDLE_DIGEST: ${{ needs.trusted_issue_snapshot.outputs.bundle_digest }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_TARGET: ${{ needs.intake_gate.outputs.target_number }}
          SNAPSHOT_PATH: ${{ runner.temp }}/trusted-intake-download/context.json
        if: ${{ steps.reserve_daily_budget.outputs.allowed == 'true' }}
        name: Verify trusted snapshot provenance before inference
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: "const fs = require(\"fs\");\nconst path = require(\"path\");\nconst {pathToFileURL} = require(\"url\");\nconst contract = await import(\n  pathToFileURL(\n    path.join(\n      process.env.RUNNER_TEMP,\n      \"trusted-intake-download/contract.mjs\",\n    ),\n  ).href\n);\nconst bundle = JSON.parse(\n  fs.readFileSync(process.env.SNAPSHOT_PATH, \"utf8\"),\n);\nconst artifact = await github.request(\n  \"GET /repos/{owner}/{repo}/actions/artifacts/{artifact_id}\",\n  {\n    owner: context.repo.owner,\n    repo: context.repo.repo,\n    artifact_id: Number(process.env.EXPECTED_ARTIFACT_ID),\n  },\n);\ncontract.verifyArtifactProvenance({\n  bundle,\n  expectedRepository: context.repo.owner + \"/\" + context.repo.repo,\n  expectedRunId: process.env.EXPECTED_RUN_ID,\n  expectedWorkflowSha: process.env.EXPECTED_SHA,\n  expectedTargetNumber: Number(process.env.EXPECTED_TARGET),\n  artifactId: artifact.data.id,\n  expectedArtifactId: Number(process.env.EXPECTED_ARTIFACT_ID),\n  actionDigest: artifact.data.digest,\n  expectedActionDigest: process.env.EXPECTED_ARTIFACT_DIGEST,\n  expectedBundleDigest: process.env.EXPECTED_BUNDLE_DIGEST,\n});\n"
      - if: ${{ steps.reserve_daily_budget.outputs.allowed == 'true' }}
        name: Seal the verified inference snapshot outside agent-writable paths
        run: |
          set -euo pipefail
          trusted_source="${RUNNER_TEMP}/trusted-intake-download/context.json"
          sudo install -d -o root -g root -m 0755 /opt/gh-aw-trusted-intake
          sudo install -o root -g root -m 0444 "$trusted_source" /opt/gh-aw-trusted-intake/context.json
          rm -f "$trusted_source"
          rm -f "${RUNNER_TEMP}/trusted-intake-download/contract.mjs"
          rmdir "${RUNNER_TEMP}/trusted-intake-download"
          test "$(stat -c '%U:%G:%a' /opt/gh-aw-trusted-intake/context.json)" = "root:root:444"
        shell: bash
      - env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
        if: ${{ steps.reserve_daily_budget.outputs.allowed == 'true' }}
        name: Materialize immutable public repository source without credentials
        run: "set -euo pipefail\ntest \"$EXPECTED_REPOSITORY\" = \"sirkirby/unifi-mcp\"\n[[ \"$WORKFLOW_SHA\" =~ ^[0-9a-f]{40}$ ]]\n\narchive=\"${RUNNER_TEMP}/unifi-mcp-${WORKFLOW_SHA}.tar.gz\"\nextract_dir=\"${RUNNER_TEMP}/unifi-mcp-source\"\nexpected_root=\"unifi-mcp-${WORKFLOW_SHA}/\"\ncurl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \\\n  --tlsv1.2 --retry 3 \\\n  --output \"$archive\" \\\n  \"https://github.com/${EXPECTED_REPOSITORY}/archive/${WORKFLOW_SHA}.tar.gz\"\n\nwhile IFS= read -r member; do\n  case \"$member\" in\n    \"$expected_root\"*) ;;\n    *) echo \"repository archive contains an unexpected root\" >&2; exit 1 ;;\n  esac\n  case \"/$member/\" in\n    *\"/../\"*|*\"/./\"*) echo \"repository archive contains an unsafe path\" >&2; exit 1 ;;\n  esac\ndone < <(tar -tzf \"$archive\")\n\nmkdir -m 0700 \"$extract_dir\"\ntar -xzf \"$archive\" --strip-components=1 --no-same-owner -C \"$extract_dir\"\nif find \"$extract_dir\" -type l -print -quit | grep -q .; then\n  echo \"repository archive contains a symbolic link\" >&2\n  exit 1\nfi\n\nsudo install -d -o root -g root -m 0555 /opt/gh-aw-repository\nsudo cp -R \"$extract_dir/.\" /opt/gh-aw-repository/\nsudo chown -R root:root /opt/gh-aw-repository\nsudo find /opt/gh-aw-repository -type d -exec chmod 0555 {} +\nsudo find /opt/gh-aw-repository -type f -exec chmod 0444 {} +\nrm -rf \"$extract_dir\"\nrm -f \"$archive\"\n\ntest -f /opt/gh-aw-repository/AGENTS.md\ntest -f /opt/gh-aw-repository/.github/scripts/community_issue_triage_contract.mjs\ntest ! -e /opt/gh-aw-repository/.git\ntest -z \"$(find /opt/gh-aw-repository ! -user root -print -quit)\"\ntest -z \"$(find /opt/gh-aw-repository ! -group root -print -quit)\"\ntest -z \"$(find /opt/gh-aw-repository -perm /0222 -print -quit)\"\n"
        shell: bash
      - if: ${{ steps.reserve_daily_budget.outputs.allowed == 'true' }}
        name: Prove the agent repository is credential-free
        run: "set -euo pipefail\ntest ! -e /opt/gh-aw-repository/.git\nif git config --global --get-regexp '^(credential\\.|http\\..*\\.extraheader)' >/dev/null 2>&1; then\n  echo \"unexpected Git credential configuration is present\" >&2\n  exit 1\nfi\n"
        shell: bash

      - name: Download container images
        run: bash "${RUNNER_TEMP}/gh-aw/actions/download_docker_images.sh" ghcr.io/github/gh-aw-firewall/agent:0.28.9@sha256:54b2fb3068efc15a4cc1bd4033f8fa056a9b1779baeba0cb80ae95ea55e7e343 ghcr.io/github/gh-aw-firewall/api-proxy:0.28.9@sha256:a0ffb1dc926c6e5a500b336893e032a8f167d3db43c869be886874ef14280bb8 ghcr.io/github/gh-aw-firewall/squid:0.28.9@sha256:3d5dba0b0a139bbb11b5d5b8b44f277d2b18f69cf43090e3c283d750cf864baa ghcr.io/github/gh-aw-mcpg:v0.4.13@sha256:ec4008521c610e1113ed557ecec0ff64a2c2111e4cfa817bab54d9b7da24c7cc ghcr.io/github/gh-aw-node@sha256:bac2192f6374d6262116399b34fc5e143d576f82719e90a18261cae7480f4d4e
      - name: Prepare Safe Outputs Directories
        run: |
          mkdir -p "${RUNNER_TEMP}/gh-aw/safeoutputs"
          mkdir -p /tmp/gh-aw/safeoutputs
          mkdir -p /tmp/gh-aw/mcp-logs/safeoutputs
      - name: Generate Safe Outputs Config
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_FILE_ROOT: "${{ runner.temp }}/gh-aw"
          GH_AW_FILE_CONFIG: "{\"files\":[{\"path\":\"safeoutputs/config.json\",\"content_env\":\"GH_AW_SAFE_OUTPUTS_CONFIG\"}]}"
          GH_AW_SAFE_OUTPUTS_CONFIG: "{\"add_comment\":{\"discussions\":false,\"footer\":true,\"max\":1,\"staged\":false,\"target\":\"triggering\"},\"add_labels\":{\"allowed\":[\"bug\",\"enhancement\",\"documentation\",\"dependencies\",\"docker\",\"github-actions\",\"api\",\"network\",\"protect\",\"access\",\"needs-info\"],\"blocked\":[\"triage-reviewed\",\"duplicate\",\"invalid\",\"wontfix\",\"security\",\"good first issue\",\"help wanted\",\"breaking change\",\"compatibility-critical\",\"*[bot]\"],\"issue_intent\":true,\"max\":4,\"staged\":false,\"target\":\"triggering\"},\"max_bot_mentions\":1,\"mentions\":{\"enabled\":false},\"noop\":{\"max\":1,\"report-as-issue\":\"false\"}}"
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'create_files.cjs'));
            await main();
      - name: Generate Safe Outputs Tools
        env:
          GH_AW_TOOLS_META_JSON: |
            {
              "description_suffixes": {
                "add_comment": " CONSTRAINTS: Maximum 1 comment(s) can be added. Target: triggering. Supports reply_to_id for discussion threading.",
                "add_labels": " CONSTRAINTS: Maximum 4 label(s) can be added. Only these labels are allowed: [\"bug\" \"enhancement\" \"documentation\" \"dependencies\" \"docker\" \"github-actions\" \"api\" \"network\" \"protect\" \"access\" \"needs-info\"]. Target: triggering."
              },
              "repo_params": {},
              "dynamic_tools": []
            }
          GH_AW_VALIDATION_JSON: |
            {
              "add_comment": {
                "defaultMax": 1,
                "fields": {
                  "body": {
                    "required": true,
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 65000
                  },
                  "comment_id": {
                    "optionalPositiveInteger": true
                  },
                  "item_number": {
                    "issueOrPRNumber": true
                  },
                  "pr": {
                    "issueOrPRNumber": true
                  },
                  "pr_number": {
                    "issueOrPRNumber": true
                  },
                  "reply_to_id": {
                    "type": "string",
                    "maxLength": 256
                  },
                  "repo": {
                    "type": "string",
                    "maxLength": 256
                  },
                  "target": {
                    "type": "string",
                    "enum": [
                      "status"
                    ]
                  },
                  "temporary_id": {
                    "type": "string",
                    "pattern": "^#?aw_[A-Za-z0-9_]{3,12}$"
                  }
                }
              },
              "add_labels": {
                "defaultMax": 5,
                "fields": {
                  "item_number": {
                    "issueNumberOrTemporaryId": true
                  },
                  "labels": {
                    "required": true,
                    "type": "array"
                  },
                  "repo": {
                    "type": "string",
                    "maxLength": 256
                  }
                }
              },
              "mentions": {
                "enabled": false
              },
              "noop": {
                "defaultMax": 1,
                "fields": {
                  "message": {
                    "required": true,
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 65000
                  }
                }
              }
            }
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');

# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Python dependencies (uv.lock + pyproject.toml workspace)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    # Avoid semver filters: requirement-only changes may lack a comparable version.
    # Include all permitted updates; review major upgrades within the batch.
    # Security updates are grouped separately by Dependabot.
    groups:
      python-dependencies:
        patterns:
          - "*"
      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  # Worker CLI and runtime dependencies share one npm update group.
  - package-ecosystem: "npm"
    directories:
      - "/apps/worker"
      - "/apps/worker/worker"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "javascript"
      - "worker"
    groups:
      worker-dependencies:
        patterns:
          - "*"
      worker-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    ignore:
      # Keep these majors explicit: they affect the compiler/test surface or
      # must match the Node version used by CI and the worker release workflow.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "vitest"
        update-types:
          - "version-update:semver-major"

  # Docker base images (Dependabot supports version updates only).
  - package-ecosystem: "docker"
    directories:
      - "/apps/access"
      - "/apps/api"
      - "/apps/network"
      - "/apps/protect"
      - "/packages/unifi-mcp-relay"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-dependencies:
        patterns:
          - "*"

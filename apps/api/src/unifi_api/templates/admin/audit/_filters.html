<form id="audit-filters"
      hx-on::change="htmx.trigger('body', 'audit-filter-changed');"
      style="margin-bottom: 1rem;">
  <div class="grid">
    <label>Controller <input type="text" name="controller" placeholder="(any)" /></label>
    <label>Cloud connection <input type="text" name="sitemanager_connection" placeholder="(any)" /></label>
    <label>Outcome
      <select name="outcome">
        <option value="">(any)</option>
        <option value="success">success</option>
        <option value="error">error</option>
        <option value="denied">denied</option>
      </select>
    </label>
    <label>Target contains <input type="text" name="q" placeholder="(any)" /></label>
    <label>Limit
      <select name="limit">
        <option value="50" selected>50</option>
        <option value="200">200</option>
        <option value="500">500</option>
      </select>
    </label>
  </div>
  <fieldset>
    <label><input type="checkbox" id="live-tail-toggle"
      hx-on::click="toggleAuditLive(this);" /> Live-tail</label>
    <a href="/admin/audit/export.csv" onclick="downloadAuditCsv(event)" class="secondary outline" role="button">Export CSV</a>
  </fieldset>
</form>

<script>
  async function downloadAuditCsv(event) {
    event.preventDefault();
    const params = new URLSearchParams(new FormData(document.getElementById('audit-filters')));
    const key = localStorage.getItem('admin_bearer_key');
    const response = await fetch('/admin/audit/export.csv?' + params.toString(), {
      headers: key ? {Authorization: 'Bearer ' + key} : {},
      redirect: 'error'
    });
    if (response.status === 401 || response.status === 403) {
      localStorage.removeItem('admin_bearer_key');
      window.location.href = '/admin/login';
      return;
    }
    if (!response.ok) throw new Error('Audit export failed');
    const url = URL.createObjectURL(await response.blob());
    const link = document.createElement('a');
    link.href = url;
    link.download = 'audit.csv';
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }

  function toggleAuditLive(cb) {
    const slot = document.getElementById('audit-live');
    while (slot.firstChild) slot.removeChild(slot.firstChild);
    if (!cb.checked) return;
    const params = new URLSearchParams();
    const form = document.getElementById('audit-filters');
    const cloud = form.querySelector('[name=sitemanager_connection]').value;
    if (cloud) params.set('sitemanager_connection', cloud);
    const outcome = form.querySelector('[name=outcome]').value;
    const q = form.querySelector('[name=q]').value;
    if (outcome) params.set('outcome', outcome);
    if (q) params.set('q', q);
    const url = '/admin/audit/_stream' + (params.toString() ? '?' + params.toString() : '');
    slot.setAttribute('sse-connect', url);
    slot.setAttribute('sse-swap', 'audit.row');
    slot.setAttribute('hx-target', '#audit-tbody');
    slot.setAttribute('hx-swap', 'afterbegin');
    htmx.process(slot);
  }
</script>

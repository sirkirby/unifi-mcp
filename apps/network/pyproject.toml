[project]
name = "unifi-network-mcp"
dynamic = ["version"]
description = "Unifi Network MCP Server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "unifi-mcp-shared>=0.6.13,<0.7",
    # Network managers in unifi-core import aiounifi; the [network] extra
    # declares the compatibility floor for library consumers. This deployable
    # app also pins the auth client exactly so one MCP release always resolves
    # to one tested login stack for uvx/pip users (which do not consume uv.lock).
    # WAN delegation validation requires Core 0.4.30. Firewall-zone CRUD
    # requires the dual-API bridge added in Core 0.4.32. WLAN schedule-window
    # validation requires Core 0.4.34. Traffic-flow DPI name enrichment
    # requires Core 0.4.36. Exact event-key filtering and discovery require
    # Core 0.4.37; explicit zero event limits require Core 0.4.39. UTC device
    # timestamps and expanded site settings require Core 0.4.43.
    # Firewall index rejection and uncapped client lookup require Core 0.4.44.
    "unifi-core[network]>=0.4.44,<0.5",
    "aiounifi==95",
    "mcp[cli]>=2.1.1,<3",
    # Published wheels do not consume uv.lock; keep MCP transitive security
    # floors explicit so upgrades cannot retain vulnerable installed versions.
    "cryptography>=50.0.1",
    "pydantic-settings>=2.14.2",
    "PyJWT>=2.13.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "click>=8.3.3",
    "aiohttp==3.14.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",
    "omegaconf>=2.3.0",
    "jsonschema>=4.17.0",
    "typing-extensions>=4.16.0",
]

[tool.uv.sources]
unifi-mcp-shared = { workspace = true }
unifi-core = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options.root = "../.."
raw-options.tag_regex = "^(?:network/v|v)(?P<version>\\d+(?:\\.\\d+)*)(?:\\S*)$"
raw-options.git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "network/v*"]
raw-options.fallback_version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/unifi_network_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/unifi_network_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/unifi_network_mcp",
    "/README.md",
]

# Ensure config files and tool manifest are included in the package
[tool.hatch.build.targets.wheel.force-include]
"src/unifi_network_mcp/config/config.yaml" = "unifi_network_mcp/config/config.yaml"
"src/unifi_network_mcp/tools_manifest.json" = "unifi_network_mcp/tools_manifest.json"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.6.0",
    "aioresponses>=0.7.9",
    "pytest-cov>=4.0.0",
    "ruff>=0.16.1",
]

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "aioresponses>=0.7.9",
    "pytest-cov>=4.0.0",
    "ruff>=0.16.1",
]

[project.scripts]
# CLI entrypoint that launches the UniFi Network MCP server
unifi-network-mcp = "unifi_network_mcp.main:main"

[tool.ruff]
line-length = 120
exclude = ["src/unifi_network_mcp/_version.py"]  # Auto-generated by hatch-vcs

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # Line too long - handled by line-length setting above
]

[tool.ruff.lint.isort]
known-first-party = ["unifi_network_mcp", "unifi_mcp_shared", "unifi_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

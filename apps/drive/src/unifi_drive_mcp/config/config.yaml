unifi:
  # The UNAS is its own UniFi OS console, separate from the gateway: point this at the NAS.
  host: ${oc.env:UNIFI_DRIVE_HOST,""}
  username: ${oc.env:UNIFI_DRIVE_USERNAME,""}
  password: ${oc.env:UNIFI_DRIVE_PASSWORD,""}
  port: ${oc.env:UNIFI_DRIVE_PORT,443}
  verify_ssl: ${oc.env:UNIFI_DRIVE_VERIFY_SSL,false}
  # SHA-256 of the NAS certificate; pins it and overrides verify_ssl.
  # Prefer UNIFI_DRIVE_SSL_FINGERPRINT (UNIFI_SSL_FINGERPRINT is not used for the NAS).
  ssl_fingerprint: ""

server:
  host: ${oc.env:UNIFI_MCP_HOST,127.0.0.1}
  port: ${oc.env:UNIFI_MCP_PORT,3004}
  log_level: INFO

  # Tool registration mode
  # Options: eager, lazy, meta_only
  # - eager: Register all tools immediately
  # - lazy: Register meta-tools, load others on demand (default)
  # - meta_only: Register only meta-tools
  tool_registration_mode: ${oc.env:UNIFI_TOOL_REGISTRATION_MODE,lazy}

  # Tool filtering (optional, for eager mode)
  # enabled_categories: system, storage, shared_drives, file_services, nfs, logs, performance, snapshots
  # enabled_tools: specific tool names, e.g. "drive_list_disks,drive_list_storage_pools"
  enabled_categories: ${oc.env:UNIFI_ENABLED_CATEGORIES,null}
  enabled_tools: ${oc.env:UNIFI_ENABLED_TOOLS,null}

  http:
    enabled: ${oc.env:UNIFI_MCP_HTTP_ENABLED,false}
    force: ${oc.env:UNIFI_MCP_HTTP_FORCE,false}
    transport: ${oc.env:UNIFI_MCP_HTTP_TRANSPORT,streamable-http}
    # Bearer token every HTTP request must carry; empty leaves HTTP unauthenticated.
    # UNIFI_<SERVER>_MCP_HTTP_AUTH_TOKEN and the _FILE/_COMMAND spellings take precedence.
    auth_token: ${oc.env:UNIFI_MCP_HTTP_AUTH_TOKEN,""}
  diagnostics:
    enabled: ${oc.env:UNIFI_MCP_DIAGNOSTICS,false}
    log_tool_args: ${oc.env:UNIFI_MCP_DIAG_LOG_TOOL_ARGS,true}
    log_tool_result: ${oc.env:UNIFI_MCP_DIAG_LOG_TOOL_RESULT,true}
    max_payload_chars: ${oc.env:UNIFI_MCP_DIAG_MAX_PAYLOAD,2000}

policy:
  response:
    redact_sensitive_fields: ${oc.env:UNIFI_DRIVE_REDACT_SENSITIVE_FIELDS,true}
    mcp_content_mode: ${oc.env:UNIFI_DRIVE_MCP_CONTENT_MODE,adaptive}

drive:
  # Seconds to wait for one UniFi Drive response.
  timeout_seconds: ${oc.env:UNIFI_DRIVE_TIMEOUT_SECONDS,30}

# Permissions are controlled via environment variables:
#   UNIFI_TOOL_PERMISSION_MODE=confirm|bypass (default: confirm)
#   UNIFI_REQUIRE_PREVIEW_TOKEN=true|false (default: false; confirm=true needs the preview's token)
#   UNIFI_POLICY_<ACTION>=true|false (global policy gates)
#   UNIFI_POLICY_<SERVER>_<ACTION>=true|false (per-server)
#   UNIFI_POLICY_<SERVER>_<CATEGORY>_<ACTION>=true|false (per-category)
# See documentation for details.

[project]
name = "unifi-sitemanager-mcp"
dynamic = ["version"]
description = "UniFi Site Manager MCP Server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Isolated API-key lookup, API-key setup guidance and the sitemanager
    # icon family require Shared 0.6.40.
    "unifi-mcp-shared>=0.6.40,<0.7",
    # The Site Manager client, managers and models require Core 0.4.89.
    "unifi-core>=0.4.89,<0.5",
    "mcp[cli]>=2.2.0,<3",
    # Published wheels do not consume uv.lock; keep MCP transitive security
    # floors explicit so upgrades cannot retain vulnerable installed versions.
    "cryptography>=50.0.1",
    "pydantic-settings>=2.14.2",
    "PyJWT>=2.15.0",
    "python-multipart>=0.0.31",
    "anyio>=4.14.2",
    "starlette>=1.7.0",
    "click>=8.3.3",
    "multidict>=6.9.1",
    "aiohttp>=3.14.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",
    "omegaconf>=2.3.0",
    "jsonschema>=4.17.0",
    "typing-extensions>=4.16.0",
]

[project.optional-dependencies]
# OTLP trace export, enabled by OTEL_EXPORTER_OTLP_ENDPOINT; the container image installs it.
otel = ["unifi-mcp-shared[otel]"]

[tool.uv.sources]
unifi-mcp-shared = { workspace = true }
unifi-core = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options.root = "../.."
raw-options.tag_regex = "^sitemanager/v(?P<version>\\d+(?:\\.\\d+)*)(?:\\S*)$"
raw-options.git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "sitemanager/v*"]
raw-options.fallback_version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/unifi_sitemanager_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/unifi_sitemanager_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/unifi_sitemanager_mcp",
    "/README.md",
]

# Ensure config files and tool manifest are included in the package
[tool.hatch.build.targets.wheel.force-include]
"src/unifi_sitemanager_mcp/config/config.yaml" = "unifi_sitemanager_mcp/config/config.yaml"
"src/unifi_sitemanager_mcp/tools_manifest.json" = "unifi_sitemanager_mcp/tools_manifest.json"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.6.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.16.6",
]

[project.scripts]
# CLI entrypoint that launches the UniFi Site Manager MCP server
unifi-sitemanager-mcp = "unifi_sitemanager_mcp.main:main"

[tool.ruff]
line-length = 120
exclude = ["src/unifi_sitemanager_mcp/_version.py"]  # Auto-generated by hatch-vcs

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # Line too long - handled by line-length setting above
]

[tool.ruff.lint.isort]
known-first-party = ["unifi_sitemanager_mcp", "unifi_mcp_shared", "unifi_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project]
name = "unifi-mcp-relay"
dynamic = ["version"]
description = "MCP relay: bridges local MCP servers to a Cloudflare Worker gateway"
requires-python = ">=3.13"
dependencies = [
    "websockets>=17.0.1",
    "mcp[cli]>=2.0.0,<3",
    # Published wheels do not consume uv.lock; keep MCP transitive security
    # floors explicit so upgrades cannot retain vulnerable installed versions.
    "cryptography>=50.0.0",
    "pydantic-settings>=2.14.2",
    "PyJWT>=2.13.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "click>=8.3.3",
    "aiohttp>=3.14.3",
    "python-dotenv>=1.2.2",
    "unifi-mcp-shared>=0.6.7,<0.7",
    # location_timeline.py imports unifi_core.event_timeline directly. This resolves
    # today only as a transitive of unifi-mcp-shared; declare it so it does not.
    "unifi-core>=0.4.21,<0.5",
]

[project.scripts]
unifi-mcp-relay = "unifi_mcp_relay.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.6.0",
    "aioresponses>=0.7.9",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options.root = "../.."
raw-options.tag_regex = "^relay/v(?P<version>\\d+(?:\\.\\d+)*)(?:\\S*)$"
raw-options.git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "relay/v*"]
raw-options.fallback_version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/unifi_mcp_relay/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/unifi_mcp_relay"]

[tool.uv.sources]
unifi-mcp-shared = { workspace = true }
unifi-core = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

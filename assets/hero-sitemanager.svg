    <line x1="640" y1="302" x2="594" y2="342" stroke="#7C5CFF" stroke-width="3" opacity="0.5"/>
    <line x1="640" y1="302" x2="640" y2="342" stroke="#7C5CFF" stroke-width="3" opacity="0.5"/>
    <line x1="640" y1="302" x2="686" y2="342" stroke="#7C5CFF" stroke-width="3" opacity="0.5"/>
    <!-- Cloud -->
    <path d="M 614,302 A 14,14 0 0 1 614,274 A 26,26 0 0 1 664,272.4 A 14.8,14.8 0 0 1 666,302 Z"
          stroke="#7C5CFF" stroke-width="3" stroke-linejoin="round" fill="#7C5CFF" fill-opacity="0.15" opacity="0.85"/>
    <!-- Site tiles -->
    <rect x="580" y="342" width="28" height="28" rx="7" stroke="#7C5CFF" stroke-width="3" fill="#7C5CFF" fill-opacity="0.15" opacity="0.7"/>
    <rect x="626" y="342" width="28" height="28" rx="7" stroke="#7C5CFF" stroke-width="3" fill="#7C5CFF" opacity="0.7"/>
    <rect x="672" y="342" width="28" height="28" rx="7" stroke="#7C5CFF" stroke-width="3" fill="#7C5CFF" fill-opacity="0.15" opacity="0.7"/>
  </g>

  <!-- Glow rings -->
  <circle cx="640" cy="320" r="70" stroke="#7C5CFF" stroke-width="0.8" fill="none" opacity="0.15"/>
  <circle cx="640" cy="320" r="95" stroke="#7C5CFF" stroke-width="0.5" fill="none" opacity="0.08"/>

  <!-- ============================================ -->
  <!-- Layer 4: WAN metrics + SD-WAN links (right)  -->
  <!-- ============================================ -->
  <g fill="none" stroke="#7C5CFF">
    <!-- WAN latency / throughput traces, one per site -->
    <polyline points="880,180 920,172 950,186 990,160 1030,168 1070,140 1110,152 1150,138 1200,146 1240,132 1280,138"
              stroke-width="1.2" opacity="0.2" stroke-linejoin="round"/>
    <polyline points="830,240 880,232 920,252 960,236 1000,244 1040,214 1080,236 1130,226 1180,232 1230,218 1280,225"
              stroke-width="1.5" opacity="0.25" stroke-linejoin="round"/>
    <polyline points="810,310 860,306 900,316 940,302 990,312 1030,300 1080,318 1130,308 1180,314 1230,304 1280,312"
              stroke-width="2" opacity="0.3" stroke-linejoin="round"/>
    <polyline points="830,400 880,408 920,394 960,410 1000,402 1050,420 1090,398 1140,410 1190,404 1230,412 1280,406"
              stroke-width="1.5" opacity="0.25" stroke-linejoin="round"/>
    <polyline points="880,470 930,476 970,458 1010,472 1060,488 1100,466 1150,478 1200,470 1240,482 1280,476"
              stroke-width="1.2" opacity="0.2" stroke-linejoin="round"/>
    <polyline points="920,530 970,524 1010,538 1060,526 1110,514 1160,532 1210,522 1250,528 1280,520"
              stroke-width="1" opacity="0.15" stroke-linejoin="round"/>
    <!-- SD-WAN: one hub with spokes to other sites -->
    <g stroke-dasharray="6 8">
      <path d="M 1049,263.4 C 1010,240 990,215 976,196" stroke-width="1" opacity="0.18"/>
      <path d="M 1071,263.4 C 1110,240 1150,212 1174,196" stroke-width="1" opacity="0.18"/>
      <path d="M 1051.2,281 C 1020,320 990,350 966,374" stroke-width="1" opacity="0.18"/>
      <path d="M 1068.8,281 C 1110,320 1150,350 1184,366" stroke-width="1" opacity="0.18"/>
    </g>
  </g>
  <g fill="#7C5CFF">
    <!-- SD-WAN hub and spokes -->
    <rect x="1050" y="260" width="20" height="20" rx="5" opacity="0.3"/>
    <rect x="963" y="183" width="14" height="14" rx="4" opacity="0.18"/>
    <rect x="1173" y="183" width="14" height="14" rx="4" opacity="0.18"/>
    <rect x="953" y="373" width="14" height="14" rx="4" opacity="0.18"/>
    <rect x="1183" y="363" width="14" height="14" rx="4" opacity="0.18"/>
  </g>
</svg>

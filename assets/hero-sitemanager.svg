      <line x1="244.8" y1="362" x2="230" y2="396" stroke-width="1" opacity="0.22"/>
      <!-- Site F (left middle) -->
      <line x1="60" y1="320" x2="40" y2="300" stroke-width="1" opacity="0.15"/>
      <line x1="64.5" y1="340" x2="48" y2="370" stroke-width="1" opacity="0.15"/>
      <!-- Site G (lower middle) -->
      <line x1="399.3" y1="433" x2="420" y2="462" stroke-width="1.2" opacity="0.25"/>
      <line x1="377" y1="431.7" x2="350" y2="456" stroke-width="1.2" opacity="0.25"/>
      <!-- Site H (lower left) -->
      <line x1="132.5" y1="480" x2="110" y2="510" stroke-width="1" opacity="0.15"/>
      <line x1="150" y1="479.5" x2="178" y2="506" stroke-width="1" opacity="0.15"/>
      <!-- Site I (bottom) -->
      <line x1="281.1" y1="550" x2="256" y2="578" stroke-width="1" opacity="0.15"/>
      <line x1="300" y1="550" x2="330" y2="580" stroke-width="1" opacity="0.15"/>
    </g>

    <!-- Uplinks from each site toward the cloud (dashed: over the internet) -->
    <g stroke="#7C5CFF" fill="none" stroke-dasharray="4 6">
      <path d="M 101,114 C 200,150 330,200 470,250" stroke-width="1" opacity="0.18"/>
      <path d="M 274,102.8 C 340,140 410,180 480,215" stroke-width="1" opacity="0.2"/>
      <path d="M 182,223.3 C 280,250 380,280 480,295" stroke-width="1" opacity="0.2"/>
      <path d="M 385,257.5 C 410,270 450,295 490,310" stroke-width="1.2" opacity="0.3"/>
      <path d="M 262,348.5 C 330,340 410,330 490,325" stroke-width="1" opacity="0.22"/>
      <path d="M 80,330 C 200,330 340,320 480,318" stroke-width="1" opacity="0.15"/>
      <path d="M 403,407 C 420,390 450,365 490,345" stroke-width="1.2" opacity="0.28"/>
      <path d="M 150,467.5 C 260,440 380,400 475,370" stroke-width="1" opacity="0.15"/>
      <path d="M 300,531.4 C 360,480 420,430 480,400" stroke-width="1" opacity="0.15"/>
    </g>

    <!-- Site tiles (rounded squares) -->
    <g fill="#7C5CFF" stroke="#7C5CFF" stroke-width="1.5">
      <rect x="80" y="100" width="20" height="20" rx="5" fill-opacity="0.12" stroke-opacity="0.35"/>
      <rect x="251" y="85" width="22" height="22" rx="5" fill-opacity="0.12" stroke-opacity="0.35"/>
      <rect x="159" y="209" width="22" height="22" rx="5" fill-opacity="0.15" stroke-opacity="0.4"/>
      <rect x="356" y="236" width="28" height="28" rx="6" fill-opacity="0.3" stroke-opacity="0.5"/>
      <rect x="239" y="339" width="22" height="22" rx="5" fill-opacity="0.15" stroke-opacity="0.4"/>
      <rect x="61" y="321" width="18" height="18" rx="4" fill-opacity="0.1" stroke-opacity="0.25"/>
      <rect x="378" y="408" width="24" height="24" rx="5" fill-opacity="0.18" stroke-opacity="0.45"/>
      <rect x="131" y="461" width="18" height="18" rx="4" fill-opacity="0.1" stroke-opacity="0.25"/>
      <rect x="281" y="531" width="18" height="18" rx="4" fill-opacity="0.1" stroke-opacity="0.25"/>
    </g>

    <!-- Devices (small dots around each site) -->
    <g fill="#7C5CFF">
      <circle cx="58" cy="78" r="3.5" opacity="0.25"/>
      <circle cx="126" cy="84" r="3.5" opacity="0.25"/>
      <circle cx="232" cy="58" r="3.5" opacity="0.25"/>
      <circle cx="300" cy="62" r="3.5" opacity="0.25"/>
      <circle cx="296" cy="128" r="3" opacity="0.2"/>
      <circle cx="132" cy="200" r="4" opacity="0.3"/>
      <circle cx="150" cy="262" r="4" opacity="0.3"/>
      <circle cx="336" cy="208" r="4.5" opacity="0.35"/>
      <circle cx="410" cy="206" r="4.5" opacity="0.35"/>
      <circle cx="330" cy="286" r="4.5" opacity="0.35"/>
      <circle cx="212" cy="330" r="4" opacity="0.3"/>
      <circle cx="230" cy="396" r="4" opacity="0.3"/>
      <circle cx="40" cy="300" r="3" opacity="0.18"/>
      <circle cx="48" cy="370" r="3" opacity="0.18"/>
      <circle cx="420" cy="462" r="4" opacity="0.3"/>
      <circle cx="350" cy="456" r="4" opacity="0.3"/>
      <circle cx="110" cy="510" r="3" opacity="0.18"/>
      <circle cx="178" cy="506" r="3" opacity="0.18"/>
      <circle cx="256" cy="578" r="3" opacity="0.15"/>
      <circle cx="330" cy="580" r="3" opacity="0.15"/>
    </g>
  </g>

  <!-- ============================================ -->
  <!-- Layer 3: Center convergence + knot           -->
  <!-- ============================================ -->
  <circle cx="640" cy="320" r="280" fill="url(#glow)"/>

  <!-- Transition lines -->
  <g fill="none" stroke="#7C5CFF">
    <path d="M 480,215 C 530,230 575,255 605,275" stroke-width="1.2" opacity="0.2"/>
    <path d="M 490,310 C 530,312 570,315 600,318" stroke-width="2" opacity="0.35"/>
    <path d="M 490,345 C 530,345 560,345 580,348" stroke-width="1.5" opacity="0.3"/>
    <path d="M 480,400 C 520,390 560,375 585,362" stroke-width="1.2" opacity="0.2"/>
    <!-- Lines emerging toward right -->
    <path d="M 680,318 C 715,316 760,314 810,310" stroke-width="2" opacity="0.35"/>
    <path d="M 675,295 C 720,282 770,260 830,240" stroke-width="1.5" opacity="0.25"/>
    <path d="M 700,348 C 735,360 775,382 830,400" stroke-width="1.5" opacity="0.25"/>
    <path d="M 665,265 C 700,240 750,210 820,180" stroke-width="1.2" opacity="0.2"/>
    <path d="M 690,365 C 720,390 760,430 820,470" stroke-width="1.2" opacity="0.2"/>
  </g>

  <!-- Cloud over three sites (the icon mark at 4x) -->

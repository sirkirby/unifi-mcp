    <g stroke="#7C5CFF" fill="none">
      <!-- Site A (top-left) -->
      <line x1="79" y1="99" x2="58" y2="78" stroke-width="1" opacity="0.2"/>
      <line x1="101" y1="102.1" x2="126" y2="84" stroke-width="1" opacity="0.2"/>
      <!-- Site B (top) -->
      <line x1="252.5" y1="84" x2="232" y2="58" stroke-width="1" opacity="0.2"/>
      <line x1="274" y1="85.3" x2="300" y2="62" stroke-width="1" opacity="0.2"/>
      <line x1="274" y1="107.3" x2="296" y2="128" stroke-width="1" opacity="0.18"/>
      <!-- Site C (upper middle) -->
      <line x1="158" y1="213.7" x2="132" y2="200" stroke-width="1" opacity="0.22"/>
      <line x1="164.3" y1="232" x2="150" y2="262" stroke-width="1" opacity="0.22"/>
      <!-- Site D (center-left, largest) -->
      <line x1="357.9" y1="235" x2="336" y2="208" stroke-width="1.2" opacity="0.28"/>
      <line x1="383.6" y1="235" x2="410" y2="206" stroke-width="1.2" opacity="0.28"/>
      <line x1="355" y1="263.5" x2="330" y2="286" stroke-width="1.2" opacity="0.25"/>
      <!-- Site E (middle) -->
